# .pre-commit-config.yaml
# Generated by setup.sh on 2026-03-22
# Update hook versions: pre-commit autoupdate
#
# Every hook has an explicit types: or files: filter so this universal config
# works across all repo types. Hooks auto-skip when no matching files are staged.

# ─────────────────────────────────────────────────────────────────────────────
# TIER 1: Quality & Linting
# Fast checks — run on every commit. Catch formatting, style, and syntax issues
# before they reach security scanners or CI.
# ─────────────────────────────────────────────────────────────────────────────
repos:

  # --- Terraform: formatting and validation ---
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        types: [terraform]
        exclude: ^fixtures/          # ADD
      - id: terraform_validate
        types: [terraform]
        exclude: ^fixtures/          # ADD — also avoids `terraform init` on an old provider

  # --- Python: Ruff (replaces flake8, black, isort) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # --- Bash / Shell: ShellCheck ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        types: [shell]

  # --- Dockerfile: hadolint ---
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint
        types: [dockerfile]
        exclude: ^fixtures/          # ADD — the recommended digest-pinned debian
                                     # Dockerfile may pass hadolint clean, but any
                                     # future fixture edit (adding RUN apk/apt lines,
                                     # a mutable tag) trips DL3006/DL3007/DL3018.
                                     # Verified: an `alpine:3.14 + apk add curl`
                                     # variant exits 1 on DL3018.

  # --- YAML / Kubernetes manifests: yamllint ---
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-d, relaxed]
        types: [yaml]
        exclude: ^kubernetes/.*/templates/   # ADD — Measured: `yamllint -d relaxed`
                                     # exits 1 on a Helm Go template with
                                     # `syntax error: expected the node content,
                                     # but found '-'`, because a `{{- if ... }}`
                                     # control line is not YAML. The same linter
                                     # exits 0 on the chart's `values.yaml` and
                                     # `Chart.yaml`, and this anchored pattern
                                     # leaves both of them linted — only the
                                     # Go-template directory under
                                     # `kubernetes/<chart>/templates/` is skipped.

  # --- Markdown: markdownlint ---
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        types: [markdown]

  # --- TypeScript / JavaScript: ESLint (local — requires eslint in project) ---
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: true

  # --- npm: lightweight dependency audit (triggers on package-lock.json changes only) ---
  - repo: local
    hooks:
      - id: npm-audit
        name: npm audit
        entry: npm audit --audit-level=high
        language: system
        files: package-lock\.json$
        exclude: ^fixtures/          # ADD — hook is pass_filenames:false and runs at
        pass_filenames: false        #       repo root; ENOLOCK exit 1 without this

# ─────────────────────────────────────────────────────────────────────────────
# TIER 2: Secrets Gate
# Secrets are the only pre-commit security check. A credential pushed to any
# branch is a potential exposure regardless of context. SAST (Semgrep CE) and
# IaC scanning (Checkov) run at the Pull Request gate in GitHub Actions instead.
# ─────────────────────────────────────────────────────────────────────────────

  # --- Secrets detection: Gitleaks ---
  # Bypass: git push --no-verify skips this hook — CI is the compensating control
  # Runs on all file types (pass_filenames: false — scans git diff)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages: [pre-push]
