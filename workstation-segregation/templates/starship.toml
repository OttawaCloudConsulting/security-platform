add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
${env_var.WORKSTATION_CLIENT}\
$aws\
$kubernetes\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "git "

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[env_var.WORKSTATION_CLIENT]
format = "[client $env_value]($style) "
style = "bold yellow"

[aws]
format = "[$symbol($profile )(\\($region\\) )]($style)"
symbol = "aws "

[kubernetes]
disabled = false
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "k8s "

[docker_context]
format = "[$symbol$context]($style) "
symbol = "docker "

[cmd_duration]
min_time = 1000
format = "[$duration]($style) "
