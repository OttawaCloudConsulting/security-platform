---
# Repo-local trigger policy: invokes the callable security workflow on every
# pull request, all branches. The relative reference takes no @ref and resolves
# to the caller's own commit, so a PR exercises its own workflow changes.

name: PR Security

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  security:
    name: security
    uses: ./.github/workflows/security.yml
