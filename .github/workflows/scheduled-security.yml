---
# Repo-local trigger policy: invokes the callable security workflow once a
# day on the default branch, so DefectDojo holds a current `ci/<default
# branch>` engagement even when no pull request is open (Phase 27 D-14,
# D-15, ADR-024).
#
# ADOPTION: this file is OPTIONAL. A consumer that wants a daily
# default-branch scan and DefectDojo import adopts it as a second caller
# beside pr-security.yml; a consumer that does not simply leaves it out, and
# nothing else changes. Mode A (this repo carries its own copy of
# security.yml) keeps the `uses:` line below as
# `uses: ./.github/workflows/security.yml`, unchanged. Mode B (no local copy)
# replaces that single line with
# `uses: OttawaCloudConsulting/security-platform/.github/workflows/security.yml@v1`
# and copies nothing else. `gate_mode` and the `DEFECTDOJO_*` settings are
# read from the caller repo exactly as for pr-security.yml; with
# `DEFECTDOJO_URL` unset the scans still run and the import job is skipped.
#
# 06:00 America/Toronto uses GitHub's IANA `timezone:` key (GA 2026-03-19),
# so daylight saving time is handled by GitHub rather than by shifting a UTC
# cron twice a year. The Toronto DST transition happens at 02:00, so 06:00 is
# never a skipped hour.
#
# GitHub disables scheduled workflows in a PUBLIC repository after 60 days
# without repository activity (Phase 27 RESEARCH Pitfall 12). Re-enable it
# from the Actions tab, or run it once through workflow_dispatch.
#
# The job id `security` is reused on purpose (RESEARCH OQ7), so this file's
# check runs are named `security / <called job name>` on the default-branch
# commit. Required checks are evaluated on pull requests only, so these runs
# never affect a PR's required contexts.

name: Scheduled Security

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: "America/Toronto"
  # Manual run: re-enables a schedule that GitHub auto-disabled, and gives an
  # on-demand default-branch import.
  workflow_dispatch: {}

# Workflow-level FLOOR. Deliberately left at contents: read — it is what any
# job added to this file later inherits by default. The security-events grant
# is job-scoped below (least privilege, ASVS V4).
permissions:
  contents: read

jobs:
  security:
    # Same id and name as pr-security.yml's job — see the header for why.
    name: security
    # A job-level permissions block REPLACES the workflow-level set for this
    # job, so contents: read must be restated here or actions/checkout inside
    # the called workflow loses its read scope.
    permissions:
      contents: read
      # THE GRANT. Required for SARIF upload to the GitHub Security tab. The
      # caller's permission set is the CEILING for a called workflow: the
      # callee can only downgrade it, never elevate.
      security-events: write
      # Required only for private repositories. Read-only.
      actions: read
    uses: ./.github/workflows/security.yml
    # The one secret the callee needs, passed by name — explicit, never
    # `secrets: inherit` (D-12). An unset caller secret passes an empty
    # string, and the DefectDojo import then skips cleanly with a logged
    # reason.
    secrets:
      DEFECTDOJO_API_TOKEN: ${{ secrets.DEFECTDOJO_API_TOKEN }}
    # No `with:` block, deliberately, for the same reasons as pr-security.yml:
    # gate_mode falls through to the caller repo's GATE_MODE variable, and
    # the callee reads the `DEFECTDOJO_*` variables from this repo directly.
