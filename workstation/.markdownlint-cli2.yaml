# markdownlint-cli2 configuration
# Suppresses rules that are false positives or conflict with document structure.
# Rules left enabled represent real issues worth fixing.

config:
  # MD013 - Line length
  # Prose paragraphs across ADR records, red-team reports, and the primary
  # blueprint are intentionally not hard-wrapped. Enforcing 80-char width
  # would fragment dense technical rationale and reduce readability.
  MD013: false

  # MD022 - Headings should be surrounded by blank lines
  # Stylistic rule. Pervasive across ADR.md (append-only) and drafts;
  # reformatting all existing entries is undesirable churn.
  MD022: false

  # MD024 - No duplicate heading content
  # Every ADR entry reuses ### Context, ### Decision, ### Consequences under
  # its unique ## ADR-NNN parent heading. Standard ADR format — structural,
  # not ambiguous.
  MD024: false

  # MD029 - Ordered list item prefix
  # Numbered lists intentionally use explicit numbering (e.g., 3. 4.) for
  # continuation after nested content. This is a deliberate authoring choice.
  MD029: false

  # MD031 - Fenced code blocks should be surrounded by blank lines
  # Pervasive across skill definitions, plans, and drafts (215 violations).
  # Structural choice in how code blocks are embedded in instructional content.
  MD031: false

  # MD032 - Lists should be surrounded by blank lines
  # Same rationale as MD022 — minor formatting across many files.
  MD032: false

  # MD036 - No emphasis used as heading
  # Bold text (**text**) is used intentionally for inline emphasis and
  # structural labels, not as a substitute for headings.
  MD036: false

  # MD040 - Fenced code blocks should have a language specified
  # Many code blocks contain generic output, pseudocode, or mixed content
  # where a language specifier is not meaningful or accurate.
  MD040: false

  # MD060 - Table column style (compact spacing)
  # Compact pipe-delimited tables (no padding spaces) are used throughout
  # .claude/ skill and reference files. Functional and intentional.
  MD060: false

  # MD018 - No space after hash on atx style heading
  # False positive: triggers on #!/bin/bash shebangs that appear outside
  # fenced code blocks due to MD031 interactions.
  MD018: false

  # -----------------------------------------------------------------------
  # Rules left ENABLED (real issues to fix):
  # MD001 - Heading increment (skipped heading level)
  # MD009 - No trailing spaces
  # MD010 - No hard tabs
  # MD025 - Single title / single H1 per document
  # MD034 - No bare URLs (should be wrapped in <> or []())
  # -----------------------------------------------------------------------
